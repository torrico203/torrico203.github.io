<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="site.title">임재균 — Technical Lead · Product &amp; Platform Engineer</title>
    <meta name="description" content="Technical Lead 임재균의 제품·플랫폼 엔지니어링 포트폴리오. 게임과 웹서비스의 0→1 개발, 멀티플랫폼 출시와 운영 경험." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar__inner">
        <a href="#top" class="topbar__brand" data-content="profile.name">임재균</a>
        <nav class="topbar__nav" aria-label="primary">
          <a href="#about"        data-i18n="nav.about">소개</a>
          <a href="#experience"   data-i18n="nav.experience">경력</a>
          <a href="#featured-projects" data-i18n="nav.projects">프로젝트</a>
          <a href="#publishing"   data-i18n="nav.publishing">사업 이력</a>
          <a href="#contact"      data-i18n="nav.contact">연락처</a>
        </nav>
        <button id="lang-toggle" class="lang-toggle" type="button" aria-label="language">
          <span data-i18n="lang.toggle">EN</span>
        </button>
      </div>
    </header>

    <main id="top">
      <!-- Hero -->
      <section class="hero">
        <div class="container hero__inner">
          <img class="hero__photo" alt="" data-attr-src="profile.photo" />
          <div class="hero__text">
            <h1 class="hero__name">
              <span data-content="profile.name">임재균</span>
              <span class="hero__hanja" data-content="profile.nameHanja">任宰均</span>
            </h1>
            <p class="hero__headline" data-content="profile.headline"></p>
            <p class="hero__value" data-content="profile.valueProposition"></p>
            <div class="hero__actions">
              <a href="#featured-projects" class="btn btn--primary" data-i18n="hero.viewProjects">대표 프로젝트 보기</a>
              <button type="button" class="btn btn--ghost" onclick="window.print()" data-i18n="hero.printResume">이력서 PDF</button>
              <a class="btn btn--ghost" data-profile-link="github" target="_blank" rel="noopener">GitHub</a>
            </div>
          </div>
        </div>
        <div class="container"><dl class="metrics" data-render="metrics"></dl></div>
      </section>

      <!-- About -->
      <section id="about" class="section">
        <div class="container">
          <h2 class="section__title" data-i18n="section.about">소개</h2>
          <div class="about-copy" data-render="aboutSummary"></div>
          <div class="capabilities" data-render="capabilities"></div>
        </div>
      </section>

      <!-- Featured projects -->
      <section id="featured-projects" class="section section--alt">
        <div class="container">
          <h2 class="section__title" data-i18n="section.featuredProjects">대표 프로젝트</h2>
          <div class="featured-projects" data-render="featuredProjects"></div>
        </div>
      </section>

      <!-- Experience + Education -->
      <section id="experience" class="section">
        <div class="container">
          <h2 class="section__title" data-i18n="section.experience">경력</h2>
          <ol class="timeline" data-render="experience"></ol>

          <h2 class="section__title section__title--sub" data-i18n="section.education">학력</h2>
          <ol class="timeline" data-render="education"></ol>
        </div>
      </section>

      <!-- Capabilities -->
      <section id="skills" class="section section--alt">
        <div class="container">
          <h2 class="section__title" data-i18n="section.skills">기술 역량</h2>
          <div class="skill-groups" data-render="skillGroups"></div>
        </div>
      </section>

      <!-- Career project archive -->
      <section id="projects" class="section">
        <div class="container">
          <h2 class="section__title" data-i18n="section.projectArchive">경력 프로젝트</h2>
          <p class="section__lede" data-i18n="section.projectArchiveLede">대표 프로젝트 외 게임·플랫폼 개발 및 사업화 이력입니다.</p>
          <div class="archive-list" data-render="projectArchive"></div>
        </div>
      </section>

      <!-- Business: Publishing / Awards / Gov projects -->
      <section id="publishing" class="section">
        <div class="container">
          <h2 class="section__title" data-i18n="section.publishing">퍼블리싱·투자 이력</h2>
          <ol class="event-list" data-render="publishing"></ol>

          <h2 class="section__title section__title--sub" data-i18n="section.awards">수상 내역</h2>
          <ol class="cred-cards" data-render="awards"></ol>

          <h2 class="section__title section__title--sub" data-i18n="section.govProjects">정부과제 수행 이력</h2>
          <div class="table-wrap"><table class="data-table" data-render="govProjects"></table></div>
        </div>
      </section>

      <!-- Resume extras: Certs / Military -->
      <section id="resume-extras" class="section section--alt">
        <div class="container">
          <h2 class="section__title" data-i18n="section.certifications">자격증</h2>
          <ol class="cred-cards" data-render="certifications"></ol>

          <h2 class="section__title section__title--sub" data-i18n="section.military">병역</h2>
          <p data-render="military"></p>
        </div>
      </section>

      <!-- Contact -->
      <section id="contact" class="section">
        <div class="container">
          <h2 class="section__title" data-i18n="section.contact">연락처</h2>
          <dl class="contact" data-render="contact"></dl>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <span data-i18n="footer.copyright">© 2026 torrico203</span>
      </div>
    </footer>

    <script src="assets/data.js"></script>
    <script src="assets/i18n.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
